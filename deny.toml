# Project policies.
#
# These policies can be enforced using `cargo deny check`.

[advisories]

[licenses]
# Allow common non-restrictive licenses. ISC is used for various DNS and crypto
# things, and it's a minimally restrictive open source license. Everything not
# in this list (including AGPL, unlicensed, and copyleft) is denied by default.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "CC0-1.0", "ISC", "OpenSSL", "Zlib", "Unicode-3.0", "Unicode-DFS-2016"]

[[licenses.clarify]]
# Ring has a messy license.
name = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [
    { path = "LICENSE", hash = 3171872035 },
]

[bans]
# Warn about multiple versions of the same crate, unless we've indicated otherwise below.
multiple-versions = "warn"

deny = [
    # OpenSSL has caused endless deployment and build problems, and we want
    # nothing to do with it. We use rustls for TLS. Note that `diesel` depends
    # on `libpq`, which depends on OpenSSL at the C level for database
    # connections, but that's handled by the system library.
    #
    # Note: openssl-probe is allowed - it's a tiny crate that just finds system
    # CA cert paths, used by rustls-native-certs. Despite the name, it doesn't
    # link to or depend on OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
]

skip = [
]

skip-tree = [
    # Build-only dependency uses some stale crates.
    { name = "pest_meta" },
    # We're never running on top of a real WASI platform, so just ignore it.
    { name = "wasi"},
]

