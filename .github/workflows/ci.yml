name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --verbose

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --verbose -- -D warnings

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_container: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_container: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_container: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_container: false

    steps:
      - uses: actions/checkout@v4

      - name: Build (Linux musl with Docker)
        if: matrix.use_container
        run: |
          docker build -f Dockerfile.build -t build-falconeri .
          docker run --name build-falconeri-container -e CARGO_ARGS=--release build-falconeri
          mkdir -p bin/release
          docker cp build-falconeri-container:/volume/target/x86_64-unknown-linux-musl/release/falconeri bin/release/
          docker cp build-falconeri-container:/volume/target/x86_64-unknown-linux-musl/release/falconerid bin/release/
          docker cp build-falconeri-container:/volume/target/x86_64-unknown-linux-musl/release/falconeri-worker bin/release/

      - name: Install Rust (non-Linux)
        if: ${{ !matrix.use_container }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies (non-Linux)
        if: ${{ !matrix.use_container }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (non-Linux)
        if: ${{ !matrix.use_container }}
        run: cargo build --release --target ${{ matrix.target }}
